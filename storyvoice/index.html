<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>StoryVoice – Read your child's school book aloud, in your voice</title>
<meta name="description" content="For parents in the UK who don't read English: photograph your child's school reading book and hear it read aloud, with translation.">
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#1d2433;background:#fffaf3;line-height:1.55}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;max-width:1000px;margin:auto}
.logo{font-weight:800;font-size:1.3rem;color:#e0673a}.langs button{border:1px solid #ddd;background:#fff;border-radius:20px;padding:5px 11px;margin-left:4px;cursor:pointer}
.langs button.on{background:#e0673a;color:#fff;border-color:#e0673a}
.hero{max-width:1000px;margin:auto;padding:30px 20px;display:grid;grid-template-columns:1.2fr 1fr;gap:36px;align-items:center}
h1{font-size:2.4rem;line-height:1.15;margin:0 0 14px}.sub{font-size:1.15rem;color:#4b5468}
video{width:100%;max-width:320px;border-radius:22px;box-shadow:0 12px 40px #0002;display:block;margin:auto}
.steps{background:#fff;padding:40px 20px}.steps>div{max-width:1000px;margin:auto}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.card{background:#fff4ea;border-radius:16px;padding:20px}.num{font-size:1.8rem;font-weight:800;color:#e0673a}
form{background:#fff;padding:22px;border-radius:16px;box-shadow:0 6px 24px #0001;margin-top:20px}
input,select{width:100%;padding:12px;margin:6px 0 12px;border:1px solid #ccc;border-radius:10px;font-size:1rem}
button.cta{width:100%;background:#e0673a;color:#fff;border:0;padding:14px;border-radius:10px;font-size:1.05rem;font-weight:700;cursor:pointer}
#msg{margin-top:10px;font-weight:600}.small{font-size:.85rem;color:#6b7280}footer{text-align:center;padding:30px;color:#888;font-size:.85rem}
@media(max-width:760px){.hero,.grid{grid-template-columns:1fr}h1{font-size:1.9rem}}
</style></head><body>
<header><div class="logo">📖 StoryVoice</div><div class="langs"><button data-l="en">EN</button><button data-l="ro">RO</button><button data-l="pl">PL</button></div></header>
<section class="hero"><div>
<h1 data-t="h1"></h1><p class="sub" data-t="sub"></p>
<form id="f"><strong data-t="ftitle"></strong>
<input type="email" id="email" required maxlength="200" data-p="email">
<select id="lang"><option>Română</option><option>Polski</option><option>Українська</option><option>Български</option><option>Português</option><option>العربية</option><option data-t="other"></option></select>
<select id="age"><option value="4-5">4–5</option><option value="6-7">6–7</option><option value="8-9">8–9</option><option value="10+">10+</option></select>
<button class="cta" data-t="btn"></button><div id="msg"></div><p class="small" data-t="privacy"></p></form>
</div><div><video src="concept.mp4" poster="poster.jpg" controls playsinline preload="metadata"></video></div></section>
<section class="steps"><div><h2 data-t="how"></h2><div class="grid">
<div class="card"><div class="num">1</div><b data-t="s1t"></b><p data-t="s1"></p></div>
<div class="card"><div class="num">2</div><b data-t="s2t"></b><p data-t="s2"></p></div>
<div class="card"><div class="num">3</div><b data-t="s3t"></b><p data-t="s3"></p></div></div></div></section>
<footer data-t="foot"></footer>
<script>
const T={en:{h1:"Read your child's school book with them — even if you don't read English",sub:"Photograph a page of the reading book your child brings home. StoryVoice reads it aloud, highlights each word, and lets you tap any word to see it in your language.",ftitle:"Join the free waitlist",email:"Your email",other:"Other",btn:"Join the waitlist",privacy:"Free. No spam. We only email you when the app is ready. Book photos stay on your phone — nothing is stored.",how:"How it works",s1t:"Take a photo",s1:"Snap the page of your child's school reading book.",s2t:"Hear it read — in your voice",s2:"The app reads it aloud and highlights the words. Record your voice once and it can read in your voice.",s3t:"Understand every word",s3:"Tap a word or sentence to see it in Romanian, Polish or your language.",ok:"Thank you! You're on the list.",err:"Something went wrong. Please try again.",foot:"StoryVoice — a concept in development. © 2026"},
ro:{h1:"Citește cu copilul cartea de la școală — chiar dacă nu știi engleză",sub:"Fă o poză paginii din cartea pe care copilul o aduce acasă. StoryVoice o citește cu voce tare, colorează fiecare cuvânt și îți arată orice cuvânt în limba ta.",ftitle:"Intră gratuit pe lista de așteptare",email:"Emailul tău",other:"Alta",btn:"Vreau pe listă",privacy:"Gratuit. Fără spam. Îți scriem doar când aplicația e gata. Pozele rămân pe telefonul tău — nu păstrăm nimic.",how:"Cum funcționează",s1t:"Faci o poză",s1:"Fotografiezi pagina din cartea de citit de la școală.",s2t:"O auzi citită — cu vocea ta",s2:"Aplicația citește și colorează cuvintele. Îți înregistrezi vocea o dată și poate citi cu vocea ta.",s3t:"Înțelegi fiecare cuvânt",s3:"Atingi un cuvânt sau o propoziție și o vezi în română, poloneză sau limba ta.",ok:"Mulțumim! Ești pe listă.",err:"A apărut o eroare. Încearcă din nou.",foot:"StoryVoice — concept în dezvoltare. © 2026"},
pl:{h1:"Czytaj z dzieckiem szkolną książkę — nawet jeśli nie znasz angielskiego",sub:"Zrób zdjęcie strony książki, którą dziecko przynosi ze szkoły. StoryVoice przeczyta ją na głos, podświetli każde słowo i pokaże je w Twoim języku.",ftitle:"Dołącz do bezpłatnej listy oczekujących",email:"Twój e-mail",other:"Inny",btn:"Dołączam",privacy:"Za darmo. Bez spamu. Napiszemy tylko, gdy aplikacja będzie gotowa. Zdjęcia zostają w Twoim telefonie — niczego nie przechowujemy.",how:"Jak to działa",s1t:"Zrób zdjęcie",s1:"Sfotografuj stronę szkolnej książki do czytania.",s2t:"Posłuchaj — Twoim głosem",s2:"Aplikacja czyta na głos i podświetla słowa. Nagraj swój głos raz, a będzie czytać Twoim głosem.",s3t:"Zrozum każde słowo",s3:"Dotknij słowa lub zdania, aby zobaczyć je po polsku, rumuńsku lub w Twoim języku.",ok:"Dziękujemy! Jesteś na liście.",err:"Coś poszło nie tak. Spróbuj ponownie.",foot:"StoryVoice — koncepcja w przygotowaniu. © 2026"}};
let L=new URLSearchParams(location.search).get('lang')||'en';
function set(l){L=T[l]?l:'en';document.documentElement.lang=L;document.querySelectorAll('[data-t]').forEach(e=>e.textContent=T[L][e.dataset.t]);document.querySelectorAll('[data-p]').forEach(e=>e.placeholder=T[L][e.dataset.p]);document.querySelectorAll('.langs button').forEach(b=>b.classList.toggle('on',b.dataset.l==L))}
document.querySelectorAll('.langs button').forEach(b=>b.onclick=()=>set(b.dataset.l));set(L);
const U="https://mhivgcvaxliggkshylvd.supabase.co/rest/v1/waitlist",K="sb_publishable_OCHkT9VmXZMRWdv6zeXGGA_PkCSFEy9";
f.onsubmit=async e=>{e.preventDefault();const m=document.getElementById('msg');try{const r=await fetch(U,{method:'POST',headers:{apikey:K,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({email:email.value.trim(),language:lang.value,child_age:age.value,ui_lang:L})});if(!r.ok)throw 0;m.textContent=T[L].ok;f.reset()}catch(x){m.textContent=T[L].err}};
</script></body></html>
